[project]
name = "financial-lakehouse"
version = "0.1.0"
description = "Financial Data Lakehouse - portfolio project"
requires-python = ">=3.11,<3.12"
authors = [{name = "Fei Huang"}]
dependencies = [
    "pyspark==3.5.3",
    "delta-spark==3.2.0",
    "pydantic==2.9.*",
    "pydantic-settings==2.5.*",
    "boto3==1.35.*",
    "pandas==2.2.*",
    "pyarrow==17.*",
]

[project.optional-dependencies]
producers = [
    "websockets==13.*",
    "aiohttp==3.10.*",
    "aiofiles==24.*",
    "alpaca-py==0.30.*",
    "yfinance==0.2.*",
]
airflow = [
    "apache-airflow==2.10.3",
    "apache-airflow-providers-apache-spark==4.10.*",
    "apache-airflow-providers-amazon==9.0.*",
]
metrics = [
    "prometheus-client==0.21.*",
    "fastapi==0.115.*",
    "uvicorn==0.32.*",
]
dev = [
    "pytest==8.3.*",
    "pytest-cov==5.*",
    "pytest-asyncio==0.24.*",
    "ruff==0.7.*",
    "mypy==1.13.*",
    "pre-commit==4.0.*",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines", "producers", "metrics_publisher", "jobs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "PTH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pipelines", "producers", "metrics_publisher", "jobs"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyspark.*", "delta.*", "boto3.*", "airflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires Spark or compose resources",
    "slow: takes more than 30s",
]
